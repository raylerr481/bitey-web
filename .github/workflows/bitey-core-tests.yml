name: Bitey Core Capability Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run capability boundary tests
        run: node --experimental-default-type=module --test tests/core-capability-boundary.test.mjs
