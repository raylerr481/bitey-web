name: Bitey Web Certification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for public deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bitey-web.raylerr481.workers.dev"
          for i in {1..20}; do
            if curl -L -fsS --max-time 20 "$BASE/" | grep -q "Bitey IA"; then
              echo "PUBLIC DEPLOYMENT READY"
              exit 0
            fi
            sleep 10
          done
          echo "Public deployment did not become ready in time"
          exit 1

      - name: Run Bitey Web certification
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bitey-web.raylerr481.workers.dev"

          diag=$(curl -L -fsS --retry 5 --retry-delay 3 --max-time 30 "$BASE/api/diagnostics/providers")
          echo "$diag" | grep -q '"ok":true'
          echo "$diag" | grep -q '"policy":"groq-primary-free-only"'
          echo "$diag" | grep -q '"configured":true'
          echo "$diag" | grep -q '"enabled":true'

          edge=$(curl -L -fsS --retry 5 --retry-delay 3 --max-time 60 "$BASE/api/diagnostics/edge-ai")
          echo "$edge" | grep -q '"selected_provider":"groq"'
          echo "$edge" | grep -q '"policy":"groq-primary-free-only"'
          echo "$edge" | grep -q '"answer"'

          echo "CERTIFICATION PROVIDER CHECKS PASSED"
          echo "CERTIFICATION PASSED: Bitey IA Web public provider policy is Groq-primary free-only"
