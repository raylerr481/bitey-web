name: Bitey Web Certification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for public deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bitey-web.raylerr481.workers.dev"
          for i in {1..20}; do
            if curl -L -fsS --max-time 20 "$BASE/" | grep -q "Bitey IA"; then
              echo "PUBLIC DEPLOYMENT READY"
              exit 0
            fi
            sleep 10
          done
          echo "Public deployment did not become ready in time"
          exit 1

      - name: Run Bitey Web certification
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bitey-web.raylerr481.workers.dev"

          diag=$(curl -L -fsS --retry 5 --retry-delay 3 --max-time 30 "$BASE/api/diagnostics/providers")
          echo "$diag" | grep -q '"ok":true'
          echo "$diag" | grep -q '"policy":"groq-openrouter-free-only-no-paid-fallback"'
          echo "$diag" | grep -q '"configured":true'
          echo "$diag" | grep -q '"enabled":true'

          edge_status=0
          edge=$(curl -L -sS --retry 5 --retry-delay 3 --max-time 60 -w '\n__HTTP_STATUS:%{http_code}' "$BASE/api/diagnostics/edge-ai") || edge_status=$?
          echo "EDGE_DIAGNOSTIC_RESPONSE:"
          echo "$edge"
          if [ "$edge_status" -ne 0 ]; then
            echo "edge diagnostics curl failed with exit code $edge_status"
            exit "$edge_status"
          fi
          edge_body="${edge%$'\n__HTTP_STATUS:'*}"
          edge_http="${edge##*$'\n__HTTP_STATUS:'}"
          if [ "$edge_http" != "200" ]; then
            echo "edge diagnostics returned HTTP $edge_http"
            exit 1
          fi
          echo "$edge_body" | grep -q '"policy":"groq-openrouter-free-only-no-paid-fallback"'
          echo "$edge_body" | grep -q '"answer"'
          echo "$edge_body" | grep -Eq '"selected_provider":"(groq|openrouter)"'

          conversation=$(curl -L -fsS --retry 5 --retry-delay 3 --max-time 30             -H 'Content-Type: application/json'             -d '{"metadata":{}}'             "$BASE/api/v1/conversations")
          conversation_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["conversation_id"])' <<< "$conversation")
          test_response=$(curl -L -fsS --retry 3 --retry-delay 2 --max-time 90             -H 'Content-Type: application/json'             -d '{"message":"¿Qué es Bitcoin?","metadata":{}}'             "$BASE/api/v1/conversations/$conversation_id/messages")
          TEST_RESPONSE="$test_response" python - <<'PY'
          import json, os
          payload = json.loads(os.environ["TEST_RESPONSE"])
          answer = payload.get("answer", "")
          assert answer.strip(), "Bitcoin conceptual certification returned an empty answer"
          forbidden = (
              "SBT ejecutó", "Smart Money Concepts", "BOS/CHOCH", "FVG",
              "order blocks", "backtest determinista", "señal técnica",
              "No se enviaron órdenes",
          )
          leaked = [item for item in forbidden if item.lower() in answer.lower()]
          assert not leaked, f"General Bitcoin question drifted into SBT: {leaked}"
          print("CERTIFICATION GENERAL-DOMAIN BOUNDARY PASSED")

          current_response=$(curl -L -fsS --retry 3 --retry-delay 2 --max-time 120 \\
            -H 'Content-Type: application/json' \\
            -d '{"message":"¿Cuál es el precio actual de Bitcoin en USD?","metadata":{}}' \\
            "$BASE/api/v1/conversations/$conversation_id/messages")
          CURRENT_RESPONSE="$current_response" python - <<'PY'
          import json, os
          payload = json.loads(os.environ["CURRENT_RESPONSE"])
          answer = payload.get("answer", "")
          assert answer.strip(), "Current-information certification returned an empty answer"
          print("CERTIFICATION CURRENT-INFORMATION RESPONSE PRESENT")
          PY

          followup=$(curl -L -fsS --retry 3 --retry-delay 2 --max-time 90 \\
            -H 'Content-Type: application/json' \\
            -d '{"message":"¿Y qué significa ese precio?","metadata":{}}' \\
            "$BASE/api/v1/conversations/$conversation_id/messages")
          FOLLOWUP_RESPONSE="$followup" python - <<'PY'
          import json, os
          payload = json.loads(os.environ["FOLLOWUP_RESPONSE"])
          answer = payload.get("answer", "")
          assert answer.strip(), "Follow-up certification returned an empty answer"
          print("CERTIFICATION FOLLOW-UP RESPONSE PRESENT")
          PY

          echo "CERTIFICATION PROVIDER CHECKS PASSED"
          echo "CERTIFICATION PASSED: Bitey IA Web public provider policy is Groq/OpenRouter free-only"
