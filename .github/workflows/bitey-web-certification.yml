name: Bitey Web Certification

on:
  workflow_run:
    workflows: ["Deploy Bitey Web"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Certify public Bitey IA Web
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bitey-web.raylerr481.workers.dev"
          echo "== Basic endpoints and Groq free-only provider =="
          test "$(curl -L -sS -o /tmp/root -w '%{http_code}' --max-time 20 "$BASE/")" = "200"
          test "$(curl -L -sS -o /tmp/providers -w '%{http_code}' --max-time 20 "$BASE/api/diagnostics/providers")" = "200"
          jq -e '.ok == true and .policy == "groq-primary-free-only" and .groq.configured == true and .groq.enabled == true' /tmp/providers >/dev/null
          test "$(curl -L -sS -o /tmp/ai -w '%{http_code}' --max-time 45 "$BASE/api/diagnostics/edge-ai")" = "200"
          jq -e '.ok == true and .selected_provider == "groq" and (.answer | length) > 0 and .policy == "groq-primary-free-only"' /tmp/ai >/dev/null

          echo "== Conversation + 2+2 + memory + research =="
          test "$(curl -L -sS -o /tmp/conversation -w '%{http_code}' --max-time 30 -X POST "$BASE/api/v1/conversations" -H 'Content-Type: application/json' --data '{"metadata":{"channel":"ci","interface":"certification"}}')" = "200"
          CID=$(jq -r '.conversation_id // empty' /tmp/conversation)
          test -n "$CID"
          test "$(curl -L -sS -o /tmp/math -w '%{http_code}' --max-time 45 -X POST "$BASE/api/v1/conversations/$CID/messages" -H 'Content-Type: application/json' --data '{"message":"2+2"}')" = "200"
          jq -e '.answer and (.answer | length > 0) and .selected_provider == "groq" and (.providers | index("groq")) != null' /tmp/math >/dev/null
          grep -Eq '(^|[^0-9])4([^0-9]|$)' /tmp/math
          test "$(curl -L -sS -o /tmp/memory1 -w '%{http_code}' --max-time 45 -X POST "$BASE/api/v1/conversations/$CID/messages" -H 'Content-Type: application/json' --data '{"message":"Mi nombre es Rayler."}')" = "200"
          jq -e '.selected_provider == "groq"' /tmp/memory1 >/dev/null
          test "$(curl -L -sS -o /tmp/memory2 -w '%{http_code}' --max-time 45 -X POST "$BASE/api/v1/conversations/$CID/messages" -H 'Content-Type: application/json' --data '{"message":"¿Cómo me llamo?"}')" = "200"
          jq -e '.selected_provider == "groq"' /tmp/memory2 >/dev/null
          grep -qi 'Rayler' /tmp/memory2
          test "$(curl -L -sS -o /tmp/research -w '%{http_code}' --max-time 60 -X POST "$BASE/api/v1/conversations/$CID/messages" -H 'Content-Type: application/json' --data '{"message":"Investiga en la web alternativas gratuitas para crear una IA y dame fuentes."}')" = "200"
          jq -e '.answer and (.answer | length > 0) and .selected_provider == "groq" and (.providers | index("groq")) != null' /tmp/research >/dev/null
          jq -e '.research_required == true and (.sources | type) == "array" and (.sources | length) > 0' /tmp/research >/dev/null
          jq -e '.sources[0].url and (.sources[0].url | startswith("http"))' /tmp/research >/dev/null

          echo "== Skills + zero-cost =="
          test "$(curl -L -sS -o /tmp/skills -w '%{http_code}' --max-time 20 "$BASE/api/v1/skills")" = "200"
          jq -e '.skywork_dependency == false and (.skills | length) >= 1' /tmp/skills >/dev/null
          test "$(curl -L -sS -o /tmp/zero -w '%{http_code}' --max-time 20 "$BASE/api/diagnostics/zero-cost")" = "200"
          jq -e '.mode == "ZERO_COST_BY_DEFAULT" and .daily_neuron_limit == 10000 and .blocked == false' /tmp/zero >/dev/null

          echo "== Warm specialized services =="
          test "$(curl -L -sS -o /tmp/jobia_health -w '%{http_code}' --max-time 60 https://jobia-api.onrender.com/health)" = "200"
          test "$(curl -L -sS -o /tmp/sbt_system -w '%{http_code}' --max-time 60 https://bitey-system-bots-trading-api.onrender.com/api/v1/system)" = "200"

          echo "== Real JobIA execution through Bitey Web =="
          post_message() {
            local outfile="$1"; local message="$2"
            : > "${outfile}.curl-error"
            curl -L -sS -D "${outfile}.headers" -o "$outfile" -w '%{http_code}' --max-time 60 \
              -X POST "$BASE/api/v1/conversations/$CID/messages" -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg message "$message" '{message:$message}')" 2>"${outfile}.curl-error"
          }
          set +e
          STATUS=$(post_message /tmp/jobia "búscame trabajo remoto")
          CURL_EXIT=$?
          set -e
          test "$CURL_EXIT" = "0" && test "$STATUS" = "200"
          grep -qi '^x-bitey-delegated: *true' /tmp/jobia.headers
          jq -e '.capability == "jobia" and .routed_by == "bitey-capability-router" and .delegation_status == "accepted" and .execution_status == "completed"' /tmp/jobia >/dev/null
          jq -e '(.result.count >= 1) and (.result.jobs | length >= 1) and ([.result.jobs[].modality] | all == "Remote")' /tmp/jobia >/dev/null

          set +e
          STATUS=$(post_message /tmp/jobia_python "busca trabajos de Python")
          CURL_EXIT=$?
          set -e
          test "$CURL_EXIT" = "0" && test "$STATUS" = "200"
          grep -qi '^x-bitey-delegated: *true' /tmp/jobia_python.headers
          jq -e '.capability == "jobia" and .execution_status == "completed" and .result_type == "opportunities" and (.result.count >= 1) and ([.result.jobs[].skills[]] | any == "Python")' /tmp/jobia_python >/dev/null
          jq -e '.result.filters.skills | index("Python") != null' /tmp/jobia_python >/dev/null

          echo "== General and SBT safety =="
          STATUS=$(post_message /tmp/general "hola")
          test "$STATUS" = "200"
          ! grep -qi '^x-bitey-delegated: *true' /tmp/general.headers
          jq -e '.answer and (.answer | length) > 0 and .selected_provider == "groq"' /tmp/general >/dev/null
          STATUS=$(post_message /tmp/general_math "2+2")
          test "$STATUS" = "200"
          ! grep -qi '^x-bitey-delegated: *true' /tmp/general_math.headers
          jq -e '.selected_provider == "groq"' /tmp/general_math >/dev/null
          grep -Eq '(^|[^0-9])4([^0-9]|$)' /tmp/general_math
          STATUS=$(post_message /tmp/sbt "analiza EUR/USD")
          test "$STATUS" = "200"
          grep -qi '^x-bitey-delegated: *true' /tmp/sbt.headers
          jq -e '.capability == "sbt" and .routed_by == "bitey-capability-router" and .delegation_status == "accepted" and .execution.live == false' /tmp/sbt >/dev/null
          STATUS=$(post_message /tmp/sbt_btc "haz un análisis de trading de BTC")
          test "$STATUS" = "200"
          grep -qi '^x-bitey-delegated: *true' /tmp/sbt_btc.headers
          jq -e '.capability == "sbt" and .delegation_status == "accepted" and .execution.live == false' /tmp/sbt_btc >/dev/null
          echo "CERTIFICATION PASSED: Groq free-only public AI, real conversation, memory, research evidence, Skills Engine, zero-cost guard, JobIA delegation, and SBT safety routing are operational."