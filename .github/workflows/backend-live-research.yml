name: Backend Live Research

on:
  push:
    branches:
      - feature/multistep-research-runtime
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  live-research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run live research tests
        env:
          BITEY_LIVE_RESEARCH: "1"
        run: python -m unittest tests.test_live_research -v
