name: backend-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: .
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: .
        run: PYTHONPATH=.:`backend python -m pytest -q backend/tests
