name: Deploy Bitey Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Deploy to Cloudflare Workers
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test public Worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Smoke test attempt ${attempt}/5"
            root_status=$(curl -L -sS -o /tmp/bitey-root.html -w '%{http_code}' --max-time 20 https://bitey-web.raylerr481.workers.dev/ || true)
            api_status=$(curl -L -sS -o /tmp/bitey-catalog.json -w '%{http_code}' --max-time 20 https://bitey-web.raylerr481.workers.dev/api/v1/workspace/catalog || true)
            ai_status=$(curl -L -sS -o /tmp/bitey-ai.json -w '%{http_code}' --max-time 30 https://bitey-web.raylerr481.workers.dev/api/diagnostics/edge-ai || true)
            echo "root=${root_status} api=${api_status} edge_ai=${ai_status}"
            if [ "$root_status" = "200" ] && [ "$api_status" = "200" ] && [ "$ai_status" = "200" ]; then
              grep -q "Workspace de Bitey IA" /tmp/bitey-root.html
              grep -q '"ok":true' /tmp/bitey-ai.json
              grep -q '"selected_provider":"cloudflare-workers-ai"' /tmp/bitey-ai.json
              echo "Public Worker and real Workers AI smoke tests passed."
              exit 0
            fi
            cat /tmp/bitey-ai.json || true
            sleep 10
          done
          echo "Public Worker smoke test failed."
          exit 1
