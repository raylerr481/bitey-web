name: Deploy Bitey Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Provider secrets are already configured on the Cloudflare Worker.
      # Deployment must not fail solely because the token cannot rewrite secrets.
      - name: Verify deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          echo "Cloudflare deployment credentials are available"

      - name: Deploy Bitey IA Web Worker
        run: npx wrangler deploy --config wrangler.toml

      - name: Smoke test public web
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bitey-web.raylerr481.workers.dev"
          body=$(curl -L -fsS --retry 5 --retry-delay 3 --max-time 30 "$BASE/")
          printf '%s' "$body" | grep -q "Bitey IA"
          printf '%s' "$body" | grep -q "Hola, soy Bitey."
          printf '%s' "$body" | grep -q "workspace-entry"
          printf '%s' "$body" | grep -q "app.js"
          echo "DEPLOYMENT SMOKE TEST PASSED"

# Keep the deployment workflow active for every main-branch application change.
