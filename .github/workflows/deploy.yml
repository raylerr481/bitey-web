name: Deploy Bitey Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync Groq provider secret
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="${2:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.toml >/tmp/wrangler-secret.log 2>&1
              echo "Synced Cloudflare secret: $name"
            else
              echo "Groq secret not supplied by GitHub Actions: $name"
            fi
          }
          put_secret GROQ_API_KEY "$GROQ_API_KEY"
          put_secret GROQ_MODEL "$GROQ_MODEL"

      - name: Deploy Bitey IA Web Worker
        run: npx wrangler deploy --config wrangler.toml

      - name: Smoke test public web
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bitey-web.raylerr481.workers.dev"
          body=$(curl -L -fsS --retry 5 --retry-delay 3 --max-time 30 "$BASE/")
          printf '%s' "$body" | grep -q "Bitey IA"
          printf '%s' "$body" | grep -q "Hola, soy Bitey."
          printf '%s' "$body" | grep -q "workspace-entry"
          printf '%s' "$body" | grep -q "app.js"
          echo "DEPLOYMENT SMOKE TEST PASSED"
